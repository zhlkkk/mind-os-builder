api_version: mindos.dev/v1
id: lint
action: wiki.lint
inputs:
  root: {required: true}
outputs: [run-envelope]
effects: [read:vault]
default_mode: dry-run
concurrency_key: "vault:{root}:wiki"
timeout_seconds: 120
retry: {attempts: 1}
success_statuses: [succeeded]
required_capabilities: [wiki.read]
required_secrets: []
schedule_hint: daily
timezone: local
