api_version: mindos.dev/v1
id: collect-twitter
action: collect.twitter
inputs:
  root: {required: true}
  provider: {default: twitter-fixture}
outputs: [run-envelope, collection-brief]
effects: [network:optional, write:raw]
default_mode: dry-run
concurrency_key: "vault:{root}:collect-twitter"
timeout_seconds: 300
retry: {attempts: 2}
success_statuses: [succeeded, partial]
required_capabilities: [collect.read, raw.write]
required_secrets: []
schedule_hint: hourly
timezone: local
