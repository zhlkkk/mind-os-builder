version: 1

collect:
  twitter:
    output_directory: raw/collect/twitter
    filters:
      include_any: [agent, protocol, benchmark]
      exclude_any: [income story]
      weights:
        benchmark: 2
        protocol: 2
        agent: 1
      minimum_score: 1
      output_limit: 20
    categories:
      agent-systems: Agent 系统
      models-research: 模型与研究
      developer-tools: 开发工具
      products-practice: 产品与实践
      other: 其他
  rss:
    output_directory: raw/collect/rss
    filters:
      include_any: [agent, protocol, benchmark]
      exclude_any: [income story]
      weights:
        benchmark: 2
        protocol: 2
        agent: 1
      minimum_score: 1
      output_limit: 20
    categories:
      agent-systems: Agent 系统
      models-research: 模型与研究
      developer-tools: 开发工具
      products-practice: 产品与实践
      other: 其他
