name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: 安装锁定依赖
        run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 代码检查
        run: npm run lint
      - name: 测试
        run: npm test
      - name: 发布包测试
        run: npm run test:pack
      - name: 架构审计
        run: npm run audit:architecture
      - name: 发布审计
        run: npm run audit:release
