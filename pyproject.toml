[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mind-os-builder"
version = "0.1.0"
description = "Build a local, agent-compatible personal knowledge operating system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
mcp = ["mcp>=1.27,<2"]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.8",
  "types-PyYAML>=6.0",
]

[project.scripts]
mindos = "mind_os_builder.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mind_os_builder"]

[tool.hatch.build.targets.wheel.force-include]
".agents/skills" = "mind_os_builder/_bundle/skills"
"agents" = "mind_os_builder/_bundle/agents"
"adapters" = "mind_os_builder/_bundle/adapters"
"jobs" = "mind_os_builder/_bundle/jobs"
"data" = "mind_os_builder/_bundle/data"

[tool.hatch.build.targets.sdist]
include = [
  "/.agents",
  "/AGENTS.md",
  "/adapters",
  "/agents",
  "/data",
  "/docs",
  "/examples",
  "/jobs",
  "/scripts",
  "/src",
  "/tests",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: requires local applications, credentials, or network access"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mind_os_builder"]
